name: android-runtime

# Runs on every push to main and every PR. The fast, required checks (test,
# companion) always run so branch protection is satisfiable on any PR — including
# docs-only ones, which previously deadlocked because a path-filtered required
# check never reported. The expensive emulator-smoke job gates its heavy work
# behind a code-paths filter, so it still reports success on docs PRs without
# burning ~20 minutes booting an emulator.
#
# The distributable companion APK is NOT built here: it moved to the manual
# `build-apk.yml` (workflow_dispatch), run on demand. PRs still validate the
# release build through the `companion` job's R8 keep-rules gate (no upload).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/OpenAndroidUse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # The runtime is dependency-free (stdlib only), so there is no go.sum
          # for the cache to key on.
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: cross-compile host targets and assemble the npm package
        working-directory: ${{ github.workspace }}
        run: |
          node ./scripts/npm/build-android-package.mjs
          node dist/npm/open-android-use/bin/open-android-use.js version
      - uses: actions/upload-artifact@v4
        with:
          name: open-android-use-npm-package
          path: dist/npm/open-android-use

  companion:
    # ubuntu-latest ships an Android SDK and Gradle. The control surface is
    # dependency-free Kotlin; the agent package adds the pinned Anthropic SDK
    # (see docs/SUPPLY_CHAIN_SECURITY.md). Runs the JVM unit tests and the R8
    # keep-rules gate. The distributable APK artifact is NOT built here — it
    # moved to the manual `build-apk.yml` (workflow_dispatch) so docs/code PRs
    # don't generate an APK on every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: companion unit tests
        run: (cd apps/OpenAndroidUseCompanion && gradle testDebugUnitTest --no-daemon)
      # Phase 5.3: validate the R8 keep-rules on every PR (build-time). The
      # minified release build catches missing-rule regressions early; on-device
      # validation of the shrunk build is the Phase 6 gate. Kept on PRs (it is a
      # correctness gate, not artifact distribution — the APK is not uploaded).
      - name: assemble minified release (R8 keep-rules gate)
        run: (cd apps/OpenAndroidUseCompanion && gradle assembleRelease --no-daemon)

  emulator-smoke:
    # Boots a real Android emulator (GitHub-hosted runners provide KVM) and
    # runs the end-to-end smoke: bridge tools against Settings, plus the
    # companion installed with its accessibility service enabled via adb. The
    # heavy steps run only when the bridge/companion/smoke code changed; on
    # docs-only PRs the job still completes green (so it is safe as a required
    # check) without booting the emulator.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'apps/OpenAndroidUse/**'
              - 'apps/OpenAndroidUseCompanion/**'
              - 'scripts/build-open-android-use.sh'
              - 'scripts/build-open-android-use-companion.sh'
              - 'scripts/run-android-smoke-tests.sh'
              - '.github/workflows/android-runtime.yml'
      - name: enable KVM
        if: steps.changes.outputs.code == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-go@v5
        if: steps.changes.outputs.code == 'true'
        with:
          go-version: "1.22"
          cache: false
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: build bridge, companion, and agent instrumentation APK
        if: steps.changes.outputs.code == 'true'
        run: |
          ./scripts/build-open-android-use.sh --os linux --arch amd64
          ./scripts/build-open-android-use-companion.sh
          (cd apps/OpenAndroidUseCompanion && gradle assembleDebugAndroidTest --no-daemon)
      - name: run emulator smoke (bridge + companion + agent loop)
        if: steps.changes.outputs.code == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The agent-loop smoke (Phase 3 plan, Milestone 4) runs inside the
          # smoke script via `am instrument` against an on-device stub model
          # server — the script installs only the test APK so the companion's
          # enabled accessibility service is never unbound by a reinstall.
          script: ./scripts/run-android-smoke-tests.sh --bridge dist/android-bridge/linux/amd64/open-android-use --agent-test-apk apps/OpenAndroidUseCompanion/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

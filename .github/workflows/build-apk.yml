name: build-apk

# Manual, on-demand build of the on-device companion APK. Split out of
# `android-runtime.yml` so the per-PR pipeline no longer generates an APK on
# every run — PRs still validate the release build via the `companion` job's
# R8 keep-rules gate (no upload). Run this from the Actions tab (Run workflow)
# when you actually want a downloadable APK artifact.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which APK(s) to build and upload"
        type: choice
        default: both
        options:
          - both
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Debug-signed APK (the artifact previously produced on every PR).
      - name: build debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: ./scripts/build-open-android-use-companion.sh
      - name: upload debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: open-android-use-companion-apk
          path: dist/companion/open-android-use-companion.apk

      # Minified (R8) release APK. Unsigned — release signing is founder-held and
      # lands in the distribution phase (Phase 7).
      - name: assemble minified release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: (cd apps/OpenAndroidUseCompanion && gradle assembleRelease --no-daemon)
      - name: upload release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: open-android-use-companion-apk-release
          path: apps/OpenAndroidUseCompanion/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
